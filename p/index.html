<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100f0e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23e9b949' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23e9b949'/%3E%3C/svg%3E" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="site-head">
  <a class="brand" href="../"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg></span><span class="brand-name">Look&nbsp;Us</span></a>
  <a class="btn btn-gold" href="../" style="padding:9px 16px;font-size:13px;">Mesure le tien →</a>
</header>

<main class="shell shell-share">
  <div class="panel cockpit" id="cockpit" data-mode="live">
    <p class="share-kicker"><span class="dot"></span> Score d'autorité · vérifié sur 5 dimensions</p>
    <div class="cockpit-top">
      <div class="score-block">
        <div class="score-num" id="score-num">—</div>
        <div class="score-meta">
          <span class="tier-badge" id="tier-badge">—</span>
          <span class="score-cap">Score d'autorité · /100</span>
        </div>
      </div>
      <svg id="score-ring" class="dial" viewBox="0 0 140 140" width="128" height="128" aria-hidden="true"></svg>
    </div>
    <div class="viz">
      <svg id="radar" viewBox="0 0 240 240" aria-hidden="true"></svg>
      <div class="dims" id="dims"></div>
    </div>
    <div class="instrument-rule" aria-hidden="true"><span>Reach·15</span><span>Reso·35</span><span>Consist·20</span><span>Moment·20</span><span>Breadth·10</span></div>
    <div class="share-cta">
      <p>Ce score ne compte pas tes followers. Il mesure si tu as une position.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn btn-gold" href="../">Calculer le mien →</a>
        <button class="btn btn-line" id="card-btn">⤓ Télécharger cette carte</button>
      </div>
    </div>
  </div>
  <p class="share-watermark">Calculé avec <b>Look&nbsp;Us</b> · <a href="../">look-us</a></p>
</main>

<script src="../assets/share-card.js"></script>
<script>
(function () {
  var DIMS = [
    { k: "reach", label: "Reach", w: "15%", color: "#e9b949" },
    { k: "resonance", label: "Resonance", w: "35%", color: "#9bb46a" },
    { k: "consistency", label: "Consistency", w: "20%", color: "#d8a657" },
    { k: "momentum", label: "Momentum", w: "20%", color: "#7daea3" },
    { k: "breadth", label: "Breadth", w: "10%", color: "#c8553d" }
  ];
  var scoreColor = function (s) { return s >= 90 ? "#8b3dff" : s >= 70 ? "#1ed760" : s >= 40 ? "#e9b949" : "#c8553d"; };
  function parseHash() {
    try {
      var h = location.hash.replace(/^#v1-/, "");
      if (!h) return null;
      return JSON.parse(atob(h.replace(/-/g, "+").replace(/_/g, "/")));
    } catch (e) { return null; }
  }
  function dial(score, tier) {
    var R = 58, C = 2 * Math.PI * R, arc = C * 0.75;
    var halo = tier === "AUTHORITY" ? "0 0 60px rgba(233,185,73,.35)" : tier === "ESTABLISHED" ? "0 0 40px rgba(233,185,73,.22)" : tier === "GROWING" ? "0 0 30px rgba(155,180,106,.18)" : "none";
    document.querySelector("#score-num").style.textShadow = halo;
    return '<g transform="rotate(135 70 70)"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#2e2920" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + arc + ' ' + C + '"/><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#e9b949" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (arc * score / 100) + ' ' + C + '"/></g><text x="70" y="74" text-anchor="middle" font-family="Fraunces,serif" font-size="11" fill="#b7ad9c" letter-spacing="1">' + tier + '</text>';
  }
  function radar(d) {
    var cx = 120, cy = 120, R = 86, n = 5, g = "";
    function pt(i, v) { var a = (i * 72 - 90) * Math.PI / 180; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; }
    [0.33, 0.66, 1].forEach(function (lvl) {
      var p = DIMS.map(function (_, i) { return pt(i, lvl).join(","); }).join(" ");
      g += '<polygon points="' + p + '" fill="none" stroke="#2e2920" stroke-width="1" opacity="' + (lvl === 1 ? .5 : .3) + '"/>';
    });
    DIMS.forEach(function (_, i) { var e = pt(i, 1); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="#2e2920" stroke-width="1" opacity=".4"/>'; });
    var pts = DIMS.map(function (dim, i) { return pt(i, Math.max(0, d[dim.k]) / 100).join(","); }).join(" ");
    g += '<polygon class="radar-poly" points="' + pts + '" fill="rgba(233,185,73,.13)" stroke="#e9b949" stroke-width="1.6"/>';
    DIMS.forEach(function (dim, i) { var e = pt(i, 1.16); g += '<text x="' + e[0] + '" y="' + e[1] + '" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#8a8273">' + dim.label + '</text>'; });
    return g;
  }
  var data = parseHash();
  if (!data) { document.querySelector("#cockpit").innerHTML = '<p class="share-kicker">Score introuvable.</p><div class="share-cta"><a class="btn btn-gold" href="../">Mesure ton autorité →</a></div>'; return; }
  var total = data.t, tier = data.tier, d = data.d;
  var sn = document.querySelector("#score-num");
  sn.textContent = Math.round(total); sn.style.color = scoreColor(total);
  document.querySelector("#tier-badge").textContent = tier;
  document.querySelector("#score-ring").innerHTML = dial(total, tier);
  document.querySelector("#radar").innerHTML = radar(d);
  document.querySelector("#dims").innerHTML = DIMS.map(function (x) {
    var v = d[x.k];
    return '<div class="dim"><div class="dim-row"><span class="dim-name">' + x.label + ' <em>' + x.w + '</em></span><span class="dim-val">' + Math.round(v) + '</span></div><div class="dim-track"><div class="dim-fill" style="width:' + v + '%;background:' + x.color + '"></div></div></div>';
  }).join("");
  var cardBtn = document.querySelector("#card-btn");
  if (cardBtn && window.LookUsCard) cardBtn.addEventListener("click", function () { window.LookUsCard.download({ total: total, tier: tier, dimensions: d }, "look-us-carte.png"); });
})();
</script>
</body>
</html>
