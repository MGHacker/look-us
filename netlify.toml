# Look Us — site statique (aucune build). La racine du repo EST le site.
[build]
  publish = "."
  command = ""

[build.environment]
  # Le package.json de la racine ne sert qu'à l'outillage de test (Playwright).
  # Sans cette variable, l'installation des dépendances par Netlify téléchargerait
  # les navigateurs (~150 Mo) pour rien : le déploiement n'exécute aucun test.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
